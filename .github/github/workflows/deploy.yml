name: Deploy Web App to Production

on:
  push:
    branches:
      - main  # Alur berjalan otomatis saat Anda melakukan push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy ke VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22  
          script: |
            script: |
        mkdir -p /var/www/uas-deployment
        cd /var/www/uas-deployment
        if [ ! -d ".git" ]; then
          git clone https://github.com/SabianMugisPramaPutra/UAS-Web.git .
        else
          git pull origin main
        fi
        mkdir -p html data