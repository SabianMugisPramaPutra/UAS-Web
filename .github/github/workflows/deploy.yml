name: Deploy Web App to Production

on:
  push:
    branches:
      - main  # Alur berjalan otomatis saat Anda melakukan push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy ke VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22  # Jika teman Anda mengubah port SSH utama VPS, sesuaikan port ini
          script: |
            # Ganti path di bawah ini sesuai lokasi folder proyek Anda di VPS
            cd /var/www/UAS-TAZKIA || (mkdir -p /var/www/UAS-TAZKIA && cd /var/www/UAS-TAZKIA)
            
            # Sinkronisasi file dari GitHub ke VPS menggunakan git (pastikan repo sudah di-clone di VPS)
            git pull origin main || true
            
            # Jalankan ulang Docker Compose untuk memperbarui halaman HTML
            docker compose up -d